<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where's My Bus? - Campus Transport</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header>
    <div class="logo-group">
      <div class="logo-icon">🚌</div>
      <div>
        <h1>
          Where's My Bus?
          <span class="live-badge"><span class="live-dot"></span> Live Feed</span>
        </h1>
        <p>Campus Transport Experience &bull; Real-Time Transit &amp; Disruption Alerts</p>
      </div>
    </div>
    <nav class="nav-links">
      <a href="/" class="nav-link active">Rider Board</a>
      <a href="/staff" class="nav-link">Staff Console &rarr;</a>
    </nav>
  </header>

  <main class="container">
    <!-- User Settings Card -->
    <section class="card">
      <div class="form-group" style="margin-bottom: 0;">
        <label for="user-ref-input">👤 Rider Identifier (saved locally):</label>
        <div style="display: flex; gap: 0.5rem;">
          <input type="text" id="user-ref-input" placeholder="e.g. user_alice or student_id" style="flex: 1;">
          <button id="save-user-btn" class="btn btn-primary btn-sm">Save ID</button>
        </div>
      </div>
    </section>

    <!-- Stop Selection Card -->
    <section class="card">
      <div class="card-header-clean">
        <span class="section-label">Campus Board</span>
        <span id="poll-indicator" style="font-size: 0.72rem; color: var(--text-muted);">Auto-updating every 15s</span>
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label for="stop-select">📍 Select Campus Stop:</label>
        <select id="stop-select">
          <option value="">Loading campus stops...</option>
        </select>
      </div>
    </section>

    <!-- Upcoming Buses List -->
    <section class="card">
      <div class="card-header-clean">
        <span class="card-title">Upcoming Arrivals</span>
        <button id="manual-refresh-btn" class="btn btn-secondary btn-sm">🔄 Refresh</button>
      </div>
      <div id="bus-list">
        <p style="color: var(--text-muted); padding: 1rem 0;">Select a stop above to view incoming buses.</p>
      </div>
    </section>

    <!-- Rider Notification Inbox -->
    <section class="card">
      <div class="card-header-clean">
        <span class="card-title">📬 Alert Inbox (<span id="inbox-user-display">you</span>)</span>
        <button id="clear-inbox-view-btn" class="btn btn-secondary btn-sm">Check Alerts</button>
      </div>
      <div id="inbox-container">
        <p style="color: var(--text-muted); font-size: 0.88rem; padding: 0.5rem 0;">No alerts received yet.</p>
      </div>
    </section>
  </main>

  <div id="toast"></div>

  <script>
    // State & Storage
    let currentStopId = localStorage.getItem("campus_selected_stop") || null;
    let currentUserRef = localStorage.getItem("campus_user_ref") || "user_alice";

    const userRefInput = document.getElementById("user-ref-input");
    const saveUserBtn = document.getElementById("save-user-btn");
    const inboxUserDisplay = document.getElementById("inbox-user-display");
    const stopSelect = document.getElementById("stop-select");
    const busList = document.getElementById("bus-list");
    const inboxContainer = document.getElementById("inbox-container");
    const manualRefreshBtn = document.getElementById("manual-refresh-btn");
    const clearInboxViewBtn = document.getElementById("clear-inbox-view-btn");
    const toast = document.getElementById("toast");

    // Init User Ref
    userRefInput.value = currentUserRef;
    inboxUserDisplay.textContent = currentUserRef;

    saveUserBtn.addEventListener("click", () => {
      const val = userRefInput.value.trim();
      if (!val) {
        showToast("Please enter a valid Rider ID", true);
        return;
      }
      currentUserRef = val;
      localStorage.setItem("campus_user_ref", currentUserRef);
      inboxUserDisplay.textContent = currentUserRef;
      showToast(`Rider ID set to "${currentUserRef}"`);
      loadInbox();
    });

    function showToast(msg, isError = false) {
      toast.textContent = msg;
      toast.style.background = isError ? "#dc2626" : "#0f172a";
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 3500);
    }

    function parseUtcDate(isoStr) {
      if (!isoStr) return null;
      let s = String(isoStr).trim();
      if (!s.endsWith("Z") && !s.includes("+") && !s.slice(-6).includes("-")) {
        s += "Z";
      }
      return new Date(s);
    }

    function formatTime(isoStr) {
      const dt = parseUtcDate(isoStr);
      if (!dt || isNaN(dt.getTime())) return "--:--";
      return dt.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
    }

    function formatUpdatedAgo(lastUpdatedIso) {
      if (!lastUpdatedIso) return "On regular schedule";
      const updatedDate = parseUtcDate(lastUpdatedIso);
      if (!updatedDate || isNaN(updatedDate.getTime())) return "On regular schedule";
      const diffMs = Date.now() - updatedDate.getTime();
      const diffMin = Math.max(0, Math.floor(diffMs / 60000));
      if (diffMin < 1) return "Updated just now";
      if (diffMin === 1) return "Updated 1m ago";
      return `Updated ${diffMin}m ago`;
    }

    // Load Stops
    async function loadStops() {
      try {
        const res = await fetch("/api/stops");
        if (!res.ok) throw new Error("Could not fetch stops");
        const stops = await res.json();
        stopSelect.innerHTML = '<option value="">-- Choose a Campus Stop --</option>';
        stops.forEach(s => {
          const opt = document.createElement("option");
          opt.value = s.id;
          opt.textContent = s.name;
          if (currentStopId && String(s.id) === String(currentStopId)) {
            opt.selected = true;
          }
          stopSelect.appendChild(opt);
        });

        if (!currentStopId && stops.length > 0) {
          stopSelect.value = stops[0].id;
          currentStopId = stops[0].id;
          localStorage.setItem("campus_selected_stop", currentStopId);
        }

        if (currentStopId) {
          loadArrivals();
        }
      } catch (err) {
        showToast("Error loading stops", true);
      }
    }

    stopSelect.addEventListener("change", (e) => {
      currentStopId = e.target.value;
      localStorage.setItem("campus_selected_stop", currentStopId);
      loadArrivals();
    });

    // Load Arrivals for Selected Stop
    async function loadArrivals() {
      if (!currentStopId) {
        busList.innerHTML = '<p style="color: var(--text-muted); padding: 1rem 0;">Select a stop to view arrivals.</p>';
        return;
      }

      try {
        const res = await fetch(`/api/stops/${currentStopId}/arrivals`);
        if (!res.ok) throw new Error("Failed to load arrivals");
        const arrivals = await res.json();

        if (arrivals.length === 0) {
          busList.innerHTML = '<p style="color: var(--text-muted); padding: 1rem 0;">No upcoming buses scheduled for this stop in the next 3 hours.</p>';
          return;
        }

        busList.innerHTML = arrivals.map(arr => {
          const isDelayed = arr.status === "DELAYED";
          const isDanger = arr.status === "BROKEN_DOWN" || arr.status === "CANCELLED";
          const delayChip = arr.delay_minutes > 0 ? `<span class="delay-chip">+${arr.delay_minutes}m delay</span>` : '';
          const schedTime = formatTime(arr.scheduled_time);
          const estTime = arr.estimated_time ? formatTime(arr.estimated_time) : (isDanger ? "Unavailable" : schedTime);

          const isRed = arr.route_name.toLowerCase().includes("red");
          const isBlue = arr.route_name.toLowerCase().includes("blue");
          const cardClass = isRed ? "card-red" : (isBlue ? "card-blue" : "");
          const pillClass = isRed ? "route-red" : (isBlue ? "route-blue" : "route-blue");
          const routeBadge = isRed ? "RED" : (isBlue ? "BLUE" : "BUS");

          const staleWarningHtml = arr.is_stale ? `
            <div class="stale-banner">
              ⚠️ Warning: Last update was &gt;10 min ago. Information may not reflect sudden road conditions.
            </div>
          ` : '';

          const msgHtml = arr.message ? `
            <div class="bus-alert-box ${isDanger ? 'danger-alert' : ''}">
              <span>📢 <strong>Alert:</strong> ${arr.message}</span>
            </div>
          ` : '';

          return `
            <div class="bus-card ${cardClass}">
              <div class="bus-header">
                <div>
                  <div class="bus-route-title">
                    <span class="route-pill ${pillClass}">${routeBadge}</span>
                    <span>${arr.route_name}</span>
                  </div>
                  <div class="bus-trip-sub">
                    Trip #${arr.trip_id} &bull; ${formatUpdatedAgo(arr.last_updated)}
                  </div>
                </div>
                <div>
                  <span class="badge badge-${arr.status}">${arr.status.replace('_', ' ')}</span>
                </div>
              </div>

              ${msgHtml}
              ${staleWarningHtml}

              <div class="bus-times-row">
                <div class="time-block">
                  <span class="time-label">Scheduled</span>
                  <span class="time-value" style="color: var(--text-muted); font-size: 1.2rem;">${schedTime}</span>
                </div>
                <div class="time-block">
                  <span class="time-label">Estimated Arrival (ETA)</span>
                  <div style="display: flex; align-items: baseline;">
                    <span class="time-value ${isDelayed ? 'delayed-val' : ''}">${estTime}</span>
                    ${delayChip}
                  </div>
                </div>
              </div>

              <div class="bus-card-footer">
                <div class="stop-indicator">
                  <span>📍</span> Stop: <strong>${arr.stop_name}</strong>
                </div>
                <button class="btn-subscribe" onclick="subscribeToRoute(${arr.route_id}, '${arr.route_name}')">
                  🔔 Subscribe to alerts
                </button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        busList.innerHTML = '<p style="color: #ef4444; padding: 1rem 0;">Failed to refresh arrivals.</p>';
      }
    }

    // Subscribe Handler
    window.subscribeToRoute = async function(routeId, routeName) {
      if (!currentUserRef) {
        showToast("Please enter your Rider Identifier first", true);
        userRefInput.focus();
        return;
      }
      if (!currentStopId) {
        showToast("Please select a stop first", true);
        return;
      }

      try {
        const res = await fetch("/api/subscriptions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user_ref: currentUserRef,
            route_id: routeId,
            stop_id: parseInt(currentStopId)
          })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Subscription failed");
        }

        showToast(`Subscribed ${currentUserRef} to alerts for ${routeName}!`);
        loadInbox();
      } catch (err) {
        showToast(err.message, true);
      }
    };

    // Load Inbox
    async function loadInbox() {
      if (!currentUserRef) return;
      try {
        const res = await fetch(`/api/inbox/${encodeURIComponent(currentUserRef)}`);
        if (!res.ok) throw new Error("Failed to load inbox");
        const notifs = await res.json();

        if (notifs.length === 0) {
          inboxContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.88rem; padding: 0.5rem 0;">No alert notifications for ' + currentUserRef + ' yet.</p>';
          return;
        }

        inboxContainer.innerHTML = notifs.map(n => `
          <div class="inbox-item">
            <div class="inbox-meta">
              <span>Trip #${n.trip_id}</span>
              <span>${formatTime(n.created_at)}</span>
            </div>
            <div class="inbox-message">${n.message}</div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    manualRefreshBtn.addEventListener("click", () => {
      loadArrivals();
      loadInbox();
      showToast("Refreshed!");
    });

    clearInboxViewBtn.addEventListener("click", loadInbox);

    // Initial load
    loadStops();
    loadInbox();

    // 15-second Polling
    setInterval(() => {
      if (currentStopId) {
        loadArrivals();
      }
      loadInbox();
    }, 15000);
  </script>
</body>
</html>
